[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssp-hunter"
version = "0.1.0"
description = "SSP Hunter - Local-first engineering opportunity intelligence system"
authors = [{ name = "SSP", email = "hello@ssp.com" }]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.14",
    "httpx>=0.25.0",
    "openai>=1.14.0",
    "ddgs>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ssp = "ssp.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]
